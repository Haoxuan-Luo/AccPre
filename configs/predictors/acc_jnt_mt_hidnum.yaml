# Stage 2B.2 — joint MULTITASK acceptance + length, drafter-hidden + numeric.
# V-prefix deployment.

run_name: acc_jnt_mt_hidnum
data_path: data_collected/stage1.pt
target: acceptance
family: hidden_numeric
mode: joint_multitask
loss: soft_bce

gamma: 8
T: 2
hidden_dim: 128
dropout: 0.1

batch_size: 16
head_lr: 1.0e-3
backbone_lr: 5.0e-5
weight_decay: 1.0e-4
warmup_ratio: 0.05
max_epochs: 3
early_stop_patience: 1
seed: 0
aux_bce: false

tau_grid: [0.1, 0.3, 0.5, 0.7, 0.9]
w_acc: 1.0
w_len: 0.3

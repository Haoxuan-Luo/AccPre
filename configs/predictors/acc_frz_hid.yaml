# Stage 2A.1 — frozen acceptance predictor, drafter-hidden-only features.
# THE ONLY V-FREE predictor in Phase 2 — online decode makes zero verifier calls.

run_name: acc_frz_hid
data_path: data_collected/stage1.pt
target: acceptance
family: hidden
mode: frozen
gamma: 8
hidden_dim: 128
dropout: 0.1
batch_size: 128
head_lr: 1.0e-3
weight_decay: 1.0e-4
warmup_ratio: 0.05
max_epochs: 10
early_stop_patience: 2
seed: 0
aux_bce: false

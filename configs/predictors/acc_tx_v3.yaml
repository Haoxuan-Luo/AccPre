# Phase 9 A3 — per-position transformer acceptance predictor.
# Feature: drafter hidden + 3 verifier-prefix numeric scalars broadcast
#          [verifier_entropy, verifier_margin, verifier_top1_prob].
# Shape: (γ, H+3) = (γ, 771). V-prefix.

run_name: acc_tx_v3
data_path: data_collected/stage1_pp.pt
target: acceptance
family: hidden_per_pos_v3
head_arch: tx
mode: frozen
loss: mse

gamma: 8

d_model: 128
num_layers: 2
num_heads: 4
dropout: 0.1

hidden_dim: 128

batch_size: 128
head_lr: 1.0e-3
weight_decay: 1.0e-4
warmup_ratio: 0.05
max_epochs: 10
early_stop_patience: 2
seed: 0
aux_bce: false

# Phase 9 A4 — per-position transformer acceptance predictor.
# Feature: drafter hidden + 5 local scalars + raw verifier_hidden broadcast.
# Shape: (γ, H+5+H_v) = (γ, 2373). V-prefix.
# The 1600-dim verifier_hidden compression is learned inside the
# encoder's input_proj layer; no hand-designed pooled summary.

run_name: acc_tx_v4
data_path: data_collected/stage1_pp.pt
target: acceptance
family: hidden_per_pos_v4
head_arch: tx
mode: frozen
loss: mse

gamma: 8

d_model: 128
num_layers: 2
num_heads: 4
dropout: 0.1

hidden_dim: 128

batch_size: 128
head_lr: 1.0e-3
weight_decay: 1.0e-4
warmup_ratio: 0.05
max_epochs: 10
early_stop_patience: 2
seed: 0
aux_bce: false

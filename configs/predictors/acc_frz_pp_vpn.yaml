# Phase 7 V1 (pp_vpn) — V-prefix minimal: per-position drafter hidden
# + verifier prefix numeric (3 scalars) broadcast to all γ positions.
#
# Deploy mode: V-prefix. Online decode pays one verifier-prefix-only
# forward per round (NOT verifier-on-draft) plus the usual drafter
# forward. Feature shape: (γ, H + 3) = (γ, 771).
# Head: AcceptanceMLPPerPos (same as pp_base); only in_dim grows.

run_name: acc_frz_pp_vpn
data_path: data_collected/stage1_pp.pt
target: acceptance
family: hidden_per_pos_numeric
head_arch: base
mode: frozen
loss: mse
gamma: 8
hidden_dim: 128
dropout: 0.1
batch_size: 128
head_lr: 1.0e-3
weight_decay: 1.0e-4
warmup_ratio: 0.05
max_epochs: 10
early_stop_patience: 2
seed: 0
aux_bce: false

# Base config for the `frozen_alpha` sweep family.
#
# Family target: acceptance (Leviathan ratio Q2_j = min(1, p/q)).
# Mode:          frozen   (precomputed records, drafter weights fixed).
# Architecture: hidden_per_pos_v2 features + tokemb_mlp head (1A line).
#
# The sweep driver (scripts/sweep_train_eval.py) overrides `run_name`,
# `head_lr`, `max_epochs`, `batch_size`, `seed`, `data_path`, and
# `total_steps_override` / `warmup_steps_override` per grid point.
# Everything else stays at the trusted 1A line defaults.

run_name: sweep_frozen_alpha
target: acceptance
family: hidden_per_pos_v2
head_arch: tokemb_mlp
mode: frozen

loss: mse

gamma: 8

hidden_dim: 128
dropout: 0.1
token_emb_dim: 64

batch_size: 128
head_lr: 1.0e-3
weight_decay: 1.0e-4
warmup_ratio: 0.05
max_epochs: 10
early_stop_patience: 2
seed: 0
aux_bce: false

# data_path is overridden by the sweep driver based on --dataset.
data_path: data_collected/stage1_pp.pt
